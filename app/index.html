<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        /* Panel de Autenticación */
        #auth-container {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        .header .icon {
            font-size: 40px;
            margin-right: 10px;
        }

        /* Tabs */
        .tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 30px;
        }

        .tab {
            padding: 10px 0;
            cursor: pointer;
            color: #999;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            background: none;
            border: none;
            font-size: 14px;
        }

        .tab:hover {
            color: #667eea;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        /* Formularios */
        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .signin-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .signin-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }

        /* Panel de Aplicación */
        #app-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: none;
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 20px;
        }

        .app-header h1 {
            font-size: 24px;
            color: #333;
        }

        .app-header p {
            color: #666;
            font-size: 14px;
        }

        .btn-logout {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ff5252;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
        }

        .input-group button {
            width: auto;
            padding: 12px 20px;
        }

        .tarea {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .tarea input[type="checkbox"] {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .tarea span {
            flex: 1;
            color: #333;
        }

        .tarea button {
            width: auto;
            padding: 8px 15px;
            background: #ff6b6b;
            color: white;
            font-size: 12px;
            border-radius: 5px;
        }

        .tarea button:hover {
            background: #ff5252;
        }

        #lista-tareas {
            margin-top: 20px;
        }

        .hidden {
            display: none;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Panel de Autenticación -->
        <div id="auth-container">
            <div class="header">
                <div><span class="icon">🚀</span><h1>Sistema de Gestión de Tareas</h1></div>
            </div>

            <div class="tabs">
                <button class="tab active" id="tab-login">Iniciar Sesión</button>
                <button class="tab" id="tab-registro">Registrarse</button>
            </div>

            <!-- Panel de Login -->
            <div id="panel-login" class="panel active">
                <h2 style="margin-bottom: 20px; color: #333;">Bienvenido de nuevo</h2>
                <form id="form-login">
                    <div class="form-group">
                        <label for="email-login">Email:</label>
                        <input type="email" id="email-login" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="password-login">Contraseña:</label>
                        <input type="password" id="password-login" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                </form>
                <div class="signin-link">
                    ¿No tienes una cuenta? <a id="tab-registro-link">Regístrate aquí</a>
                </div>
            </div>

            <!-- Panel de Registro -->
            <div id="panel-registro" class="panel" style="display: none;">
                <h2 style="margin-bottom: 20px; color: #333;">Crear cuenta nueva</h2>
                <form id="form-registro">
                    <div class="form-group">
                        <label for="nombre-registro">Nombre completo:</label>
                        <input type="text" id="nombre-registro" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="email-registro">Email:</label>
                        <input type="email" id="email-registro" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="password-registro">Contraseña:</label>
                        <input type="password" id="password-registro" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn-primary">Crear Cuenta</button>
                </form>
                <div class="signin-link">
                    ¿Ya tienes una cuenta? <a id="tab-login-link">Inicia sesión aquí</a>
                </div>
            </div>
        </div>

        <!-- Panel de Aplicación -->
        <div id="app-container">
            <div class="app-header">
                <div>
                    <h1>Mis Tareas</h1>
                    <p>Hola, <span id="lbl-usuario">Usuario</span></p>
                </div>
                <button id="btn-logout" class="btn-logout">Cerrar Sesión</button>
            </div>

            <div class="input-group">
                <input type="text" id="input-tarea" placeholder="Escribe una nueva tarea...">
                <button type="button" onclick="agregarTarea()" class="btn-primary">Agregar</button>
            </div>

            <div id="lista-tareas">
                <p>Cargando tareas...</p>
            </div>
        </div>
    </div>

    <script src="/app/app.js"></script>
    <script>
        // Script adicional para cambios de tab con links
        document.getElementById('tab-registro-link').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('panel-registro').style.display = 'block';
            document.getElementById('panel-login').style.display = 'none';
            document.getElementById('tab-registro').classList.add('active');
            document.getElementById('tab-login').classList.remove('active');
        });

        document.getElementById('tab-login-link').addEventListener('click', function(e) {
            e.preventDefault();
            document.getElementById('panel-login').style.display = 'block';
            document.getElementById('panel-registro').style.display = 'none';
            document.getElementById('tab-login').classList.add('active');
            document.getElementById('tab-registro').classList.remove('active');
        });
    </script>
</body>
</html>
