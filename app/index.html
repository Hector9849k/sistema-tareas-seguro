<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Gestión de Tareas</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 15px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1, h2 {
            color: #333;
            margin-bottom: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .auth-tabs {
            display: flex;
            gap: 20px;
            border-bottom: 2px solid #f0f0f0;
            margin-bottom: 30px;
        }

        .auth-tab {
            padding: 10px 0;
            cursor: pointer;
            color: #999;
            font-weight: 500;
            border: none;
            background: none;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            font-size: 14px;
        }

        .auth-tab:hover {
            color: #667eea;
        }

        .auth-tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            font-family: inherit;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            margin-top: 10px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .signin-link {
            text-align: center;
            margin-top: 20px;
            font-size: 14px;
            color: #666;
        }

        .signin-link a {
            color: #667eea;
            text-decoration: none;
            cursor: pointer;
        }

        .signin-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none !important;
        }

        .mensaje {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .mensaje.exito {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .mensaje.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        /* APP CONTAINER */
        #app-container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .app-header h1 {
            font-size: 24px;
            color: #333;
        }

        .app-header .user-info {
            text-align: right;
        }

        .app-header .user-info p {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .btn-logout {
            background: #ff6b6b;
            color: white;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            border: none;
            transition: all 0.3s ease;
        }

        .btn-logout:hover {
            background: #ff5252;
        }

        .app-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab {
            padding: 10px 20px;
            background: none;
            border: none;
            color: #999;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
        }

        .tab.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .task-item {
            padding: 15px;
            background: #f9f9f9;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 4px solid #667eea;
        }

        .task-item strong {
            display: block;
            margin-bottom: 5px;
            color: #333;
        }

        .task-item p {
            color: #666;
            margin: 8px 0;
        }

        .task-item small {
            color: #999;
            display: block;
            margin-top: 10px;
        }

        .task-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 10px;
        }

        .task-actions {
            display: flex;
            gap: 5px;
        }

        .task-actions button {
            padding: 8px 15px;
            font-size: 12px;
            width: auto;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .input-group input {
            flex: 1;
        }

        .input-group button {
            flex-shrink: 0;
            width: auto;
            padding: 12px 20px;
        }

        .stat-card {
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
            text-align: center;
            border-left: 4px solid #667eea;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            color: #667eea;
            margin-top: 10px;
        }

        #stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- AUTH CONTAINER -->
        <div id="auth-container" class="card">
            <div class="header">
                <div class="icon">🚀</div>
                <h1>Sistema de Gestión de Tareas</h1>
            </div>

            <div class="auth-tabs">
                <button class="auth-tab active" onclick="cambiarAuthTab('login')">Iniciar Sesión</button>
                <button class="auth-tab" onclick="cambiarAuthTab('registro')">Registrarse</button>
            </div>

            <div id="mensaje-auth"></div>

            <!-- PANEL LOGIN -->
            <div id="form-login">
                <h2 style="margin-bottom: 20px; color: #333;">Bienvenido de nuevo</h2>
                <form onsubmit="login(event)">
                    <div class="form-group">
                        <label for="login-email">Email:</label>
                        <input type="email" id="login-email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="login-password">Contraseña:</label>
                        <input type="password" id="login-password" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn-primary">Iniciar Sesión</button>
                </form>
                <div class="signin-link">
                    ¿No tienes una cuenta? <a onclick="cambiarAuthTab('registro')">Regístrate aquí</a>
                </div>
            </div>

            <!-- PANEL REGISTRO -->
            <div id="form-registro" class="hidden">
                <h2 style="margin-bottom: 20px; color: #333;">Crear cuenta nueva</h2>
                <form onsubmit="registrar(event)">
                    <div class="form-group">
                        <label for="registro-nombre">Nombre completo:</label>
                        <input type="text" id="registro-nombre" required placeholder="Tu nombre">
                    </div>
                    <div class="form-group">
                        <label for="registro-email">Email:</label>
                        <input type="email" id="registro-email" required placeholder="tu@email.com">
                    </div>
                    <div class="form-group">
                        <label for="registro-password">Contraseña:</label>
                        <input type="password" id="registro-password" required placeholder="••••••">
                    </div>
                    <button type="submit" class="btn-primary">Crear Cuenta</button>
                </form>
                <div class="signin-link">
                    ¿Ya tienes una cuenta? <a onclick="cambiarAuthTab('login')">Inicia sesión aquí</a>
                </div>
            </div>
        </div>

        <!-- APP CONTAINER -->
        <div id="app-container" class="hidden">
            <div class="app-header">
                <div>
                    <h1>Mis Tareas</h1>
                </div>
                <div class="user-info">
                    <p>Hola, <strong id="user-name">Usuario</strong></p>
                    <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
                </div>
            </div>

            <div class="app-tabs">
                <button class="tab active" onclick="cambiarTab('tareas')">📋 Tareas</button>
                <button class="tab" onclick="cambiarTab('estadisticas')">📊 Estadísticas</button>
            </div>

            <div id="mensaje-tareas"></div>

            <!-- TAB TAREAS -->
            <div id="tab-tareas">
                <div class="input-group">
                    <input type="text" id="tarea-titulo" placeholder="Escribe el título de la tarea...">
                    <input type="text" id="tarea-descripcion" placeholder="Descripción (opcional)...">
                    <button class="btn-primary" onclick="crearTarea()">Agregar</button>
                </div>
                <div id="lista-tareas">
                    <p>Cargando tareas...</p>
                </div>
            </div>

            <!-- TAB ESTADISTICAS -->
            <div id="tab-estadisticas" class="hidden">
                <h2>Estadísticas</h2>
                <div id="stats-grid">
                    <p>Cargando estadísticas...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/app/app.js"></script>
</body>
</html>
